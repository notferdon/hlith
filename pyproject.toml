[project]
name = "hlith"
version = "0.1.2"
description = "Hlith Review: catches behavior and contract changes your tests miss"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["verification", "symbolic-execution", "differential-testing", "sandbox", "landlock", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "libcst>=1.5",
  "z3-solver>=4.13",
  "hypothesis>=6.100",
  "pytest>=8",
  "tree-sitter==0.25.2",
  "tree-sitter-python==0.25.0",
]

[project.urls]
Homepage = "https://github.com/notferdon/hlith"
Repository = "https://github.com/notferdon/hlith"
Issues = "https://github.com/notferdon/hlith/issues"
Changelog = "https://github.com/notferdon/hlith/blob/main/CHANGELOG.md"

[project.optional-dependencies]
agent = [
  "langgraph==1.2.18",
  "langgraph-checkpoint==4.3.1",
  "langgraph-checkpoint-sqlite==3.1.2",
]

[project.scripts]
hlith = "hlith.operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlith"]

# Ship the single-source agent hook beside the `hlith` console script in `<venv>/bin/hlith-agent-hook`.
[tool.hatch.build.targets.wheel.shared-scripts]
"scripts/agent-hook/hlith-agent-hook.sh" = "hlith-agent-hook"

# The sdist ships source, license/notices, lock, agent hook, capability probe, first-use fixture, and user docs.
# Source-only evidence and agent-routing files are not part of the distribution.
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/scripts/sbom_draft.py", "/scripts/landlock_capabilities.py",
  "/scripts/agent-hook/hlith-agent-hook.sh", "/examples/first-use",
  "/docs/CLI.md", "/docs/OPERATOR.md", "/docs/TUI.md", "/docs/ARTIFACT.md",
  "/docs/SUPPORTED_DOMAIN.md", "/docs/REVIEW-QUICKSTART.md", "/docs/AGENT-INTEGRATION.md",
  "/docs/PROVENANCE.md", "/docs/STAGING-VIEW.md", "/LICENSE", "/ARCHITECTURE.md", "/LIMITATIONS.md",
  "/SECURITY.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/THIRD_PARTY_NOTICES.md",
  "/README.md", "/images/hlith-first-use-capture.png", "/docs/EXTERNAL-OBSERVATION.md", "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Two tiers. Fast (default): `pytest`. Real repositories (psf/requests acceptance clone): `pytest -m real`.
# Everything: `pytest -m "real or not real"`.
markers = ["real: runs against a real repository clone (slow; opt in with -m real)"]
addopts = "-m 'not real'"

[tool.uv]
# Transitive pins: keep the lock on the releases that are >= 2 weeks old at 2026-10-29 (docs/PROVENANCE.md).
constraint-dependencies = [
  "anyio==4.15.1", "jsonpatch==1.38", "jsonpointer==3.6", "langchain-core==1.7.1", "langchain-protocol==0.0.20",
  "langgraph-sdk==0.4.10", "langsmith==0.14.14", "ormsgpack==1.13.0", "pydantic==2.14.1", "pydantic-core==2.50.1",
  "typing-inspection==0.4.4", "websockets==17.3", "xxhash==4.0.2",
]

[tool.uv.exclude-newer-package]
# Match the CLI cutoffs recorded in uv.lock:12-15 (docs/PROVENANCE.md; keeps z3-solver==5.3.2.0 and tree-sitter* pinned without mutating uv.lock).
z3-solver = "2026-10-29T00:00:00Z"
tree-sitter = "2026-10-29T00:00:00Z"
tree-sitter-python = "2026-10-29T00:00:00Z"
